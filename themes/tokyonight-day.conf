##########################
# tokyonight-day palette (light)
##########################

bg="#e1e2e7"            # Editor bg
bg_dark="#d0d5e3"       # Statusline / float bg
bg_dark1="#c1c9df"      # Darkest bg
bg_highlight="#c4c8da"  # Cursor line bg

fg="#3760bf"            # Default fg
fg_dark="#6172b0"       # Dimmer fg (inactive statusline)
fg_gutter="#a8aecb"     # Line numbers, border, separator

comment="#848cb5"       # Comment fg
dark3="#8990b3"         # Dim fg (non-text)
dark5="#68709a"         # Dim fg (conceal)
terminal_black="#a1a6c5"

red="#f52a65"           # errors
red1="#c64343"          # diagnostics error / diff delete

green="#587539"         # strings
green1="#387068"        # diff add / success
green2="#38919f"        # git add

yellow="#8c6c3e"        # warnings

blue="#2e7de9"          # primary accent (identifiers, links)
blue0="#7890dd"         # search / accent bg blend
blue1="#188092"         # types, special symbols
blue2="#07879d"         # info / border
blue5="#006a83"         # operators, punctuation
blue6="#2e5857"         # regex strings
blue7="#92a6d5"         # git change bg / diff text

cyan="#007197"

magenta="#9854f1"       # keywords
magenta2="#d20065"      # markers (leap/flash/hop)

orange="#b15c00"        # numbers, constants

purple="#7847bd"

teal="#118c74"


##########################
# tokyonight-day theme colors
##########################

bg_color="$bg_dark"       # #d0d5e3
text_color="$fg"          # #3760bf
accent_color="$blue"      # #2e7de9
active_color="$fg"        # #3760bf
inactive_color="$fg_dark" # #6172b0
border_color="$fg_gutter" # #a8aecb
copy_color="$yellow"      # #8c6c3e
