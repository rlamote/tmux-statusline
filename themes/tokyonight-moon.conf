##########################
# tokyonight-moon palette
##########################

bg="#222436"            # Editor bg
bg_dark="#1e2030"       # Statusline / float bg
bg_dark1="#191b29"      # Darkest bg
bg_highlight="#2f334d"  # Cursor line bg

fg="#c8d3f5"            # Default fg
fg_dark="#828bb8"       # Dimmer fg (inactive statusline)
fg_gutter="#3b4261"     # Line numbers, border, separator

comment="#636da6"       # Comment fg
dark3="#545c7e"         # Dim fg (non-text)
dark5="#737aa2"         # Dim fg (conceal)
terminal_black="#444a73"

red="#ff757f"           # errors
red1="#c53b53"          # diagnostics error / diff delete

green="#c3e88d"         # strings
green1="#4fd6be"        # diff add / success
green2="#41a6b5"        # git add

yellow="#ffc777"        # warnings

blue="#82aaff"          # primary accent (identifiers, links)
blue0="#3e68d7"         # search / accent bg blend
blue1="#65bcff"         # types, special symbols
blue2="#0db9d7"         # info / border
blue5="#89ddff"         # operators, punctuation
blue6="#b4f9f8"         # regex strings
blue7="#394b70"         # git change bg / diff text

cyan="#86e1fc"

magenta="#c099ff"       # keywords
magenta2="#ff007c"      # markers (leap/flash/hop)

orange="#ff966c"        # numbers, constants

purple="#fca7ea"

teal="#4fd6be"


##########################
# tokyonight-moon theme colors
##########################

bg_color="$bg_dark"       # #1e2030
text_color="$fg"          # #c8d3f5
accent_color="$blue"      # #82aaff
active_color="$fg"        # #c8d3f5
inactive_color="$fg_dark" # #828bb8
border_color="$fg_gutter" # #3b4261
copy_color="$yellow"      # #ffc777
