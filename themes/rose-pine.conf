##########################
# rose-pine palette
##########################

base="#191724"         # Editor bg
surface="#1f1d2e"       # Statusline / panel bg
overlay="#26233a"       # Popup / floating window bg
muted="#6e6a86"         # Border, comments
subtle="#908caa"        # Dimmer fg (inactive statusline, line numbers)
text="#e0def4"          # Default fg

love="#eb6f92"          # red (errors)
gold="#f6c177"          # yellow (warnings)
rose="#ebbcba"          # soft pink (diagnostic hint)
pine="#31748f"          # teal (links, terminal accent)
foam="#9ccfd8"          # cyan (info, strings)
iris="#c4a7e7"          # purple (accent, selection/visual)
leaf="#95b1ac"          # green (added/success)

highlight_low="#21202e"  # subtle bg highlight
highlight_med="#403d52"  # popup selection bg
highlight_high="#524f67" # border / separator


##########################
# rose-pine theme colors
##########################

bg_color="$surface"       # #1f1d2e
text_color="$text"        # #e0def4
accent_color="$iris"      # #c4a7e7
active_color="$text"      # #e0def4
inactive_color="$subtle"  # #908caa
border_color="$muted"     # #6e6a86
copy_color="$iris"        # #c4a7e7
