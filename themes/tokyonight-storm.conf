##########################
# tokyonight-storm palette
##########################

bg="#24283b"            # Editor bg
bg_dark="#1f2335"       # Statusline / float bg
bg_dark1="#1b1e2d"      # Darkest bg
bg_highlight="#292e42"  # Cursor line bg

fg="#c0caf5"            # Default fg
fg_dark="#a9b1d6"       # Dimmer fg (inactive statusline)
fg_gutter="#3b4261"     # Line numbers, border, separator

comment="#565f89"       # Comment fg
dark3="#545c7e"         # Dim fg (non-text)
dark5="#737aa2"         # Dim fg (conceal)
terminal_black="#414868"

red="#f7768e"           # errors
red1="#db4b4b"          # diagnostics error / diff delete

green="#9ece6a"         # strings
green1="#73daca"        # diff add / success
green2="#41a6b5"        # git add

yellow="#e0af68"        # warnings

blue="#7aa2f7"          # primary accent (identifiers, links)
blue0="#3d59a1"         # search / accent bg blend
blue1="#2ac3de"         # types, special symbols
blue2="#0db9d7"         # info / border
blue5="#89ddff"         # operators, punctuation
blue6="#b4f9f8"         # regex strings
blue7="#394b70"         # git change bg / diff text

cyan="#7dcfff"

magenta="#bb9af7"       # keywords
magenta2="#ff007c"      # markers (leap/flash/hop)

orange="#ff9e64"        # numbers, constants

purple="#9d7cd8"

teal="#1abc9c"


##########################
# tokyonight-storm theme colors
##########################

bg_color="$bg_dark"       # #1f2335
text_color="$fg"          # #c0caf5
accent_color="$blue"      # #7aa2f7
active_color="$fg"        # #c0caf5
inactive_color="$fg_dark" # #a9b1d6
border_color="$fg_gutter" # #3b4261
copy_color="$yellow"      # #e0af68
