##########################
# rose-pine-dawn palette (light)
##########################

base="#faf4ed"         # Editor bg
surface="#fffaf3"       # Statusline / panel bg
overlay="#f2e9e1"       # Popup / floating window bg
muted="#9893a5"         # Border, comments
subtle="#797593"        # Dimmer fg (inactive statusline, line numbers)
text="#464261"          # Default fg

love="#b4637a"          # red (errors)
gold="#ea9d34"          # yellow (warnings)
rose="#d7827e"          # soft pink (diagnostic hint)
pine="#286983"          # teal (links, terminal accent)
foam="#56949f"          # cyan (info, strings)
iris="#907aa9"          # purple (accent, selection/visual)
leaf="#6d8f89"          # green (added/success)

highlight_low="#f4ede8"  # subtle bg highlight
highlight_med="#dfdad9"  # popup selection bg
highlight_high="#cecacd" # border / separator


##########################
# rose-pine-dawn theme colors
##########################

bg_color="$surface"       # #fffaf3
text_color="$text"        # #464261
accent_color="$iris"      # #907aa9
active_color="$text"      # #464261
inactive_color="$subtle"  # #797593
border_color="$muted"     # #9893a5
copy_color="$iris"        # #907aa9
